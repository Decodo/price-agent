# One competitor catalog. Copy this block per store you track.
[target]
seed = "https://scrapeme.live/shop/"
newest_listing = "https://scrapeme.live/shop/?orderby=date"
select_paths = ["^/shop/[^/]+/?$"]   # product pages, for /map
exclude_paths = ["^/shop/page/", "^/cart", "^/my-account", "^/product-tag/"]
sitemap = "only"         # take product URLs from the sitemap, not from links on the pages
# Batches of URLs, one URL-path regex each. Each batch is one /crawl job, run in sequence,
# which keeps the load on the store low. These 2 batches cover 131 products. Add batches to track more.
shards = ["^/shop/[A-B][^/]*/?$", "^/shop/C[^/]*/?$"]
limit = 100              # your page limit per batch, which keeps each job's cost predictable
new_product_limit = 5    # discover: at most this many new URLs fetched with /scrape per run
coverage_alert = 0.2     # alert a person when 20% or more of a run's pages are missing (for example, after a redesign)
freshness_alert_hours = 48  # alert when a page in our_prices.csv hasn't been fetched for this long
geo = "United Kingdom"   # full country name, pinned on every call
locale = "en-GB"

[css_fallback]
price = "p.price .woocommerce-Price-amount"
currency = "GBP"

[extraction]
llm_fallback = false   # true: ask an LLM only when JSON-LD and the selector both fail

# A product you sell, to check in AI answers. Your live product page is the reference price.
[[ai_shelf]]
name = "Sony WH-1000XM6"
retailer = "Sony"
product_url = "https://electronics.sony.com/audio/headphones/headband/p/wh1000xm6-b"
question = "How much do Sony WH-1000XM6 headphones cost at major US retailers right now? List retailer and price."
geo = "United States"
locale = "en-US"
core = true

# Each store's live price, to compare with the AI answers: a product page with JSON-LD, or a Decodo template
[[ai_shelf.live]]
retailer = "Amazon"
target = "amazon_product"
query = "B0F3PQHWTZ"
domain = "com"

[[ai_shelf.live]]
retailer = "Best Buy"
url = "https://www.bestbuy.com/product/sony-wh-1000xm6-best-wireless-noise-cancelling-headphones-black/J7XSRH5RCF"

[[ai_shelf.live]]
retailer = "Walmart"
target = "walmart_product"
product_id = "16504921979"

# Optional, for `price-agent serve` + `track --webhook` on a host with a public URL
[webhook]
public_url = "https://your-host.example.com/crawl-callback"

[paths]
db = "prices.db"
our_prices = "our_prices.csv"
