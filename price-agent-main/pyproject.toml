[project]
name = "price-agent"
version = "0.1.0"
description = "A price-monitoring agent that decides, not just logs. Built on the Decodo Web Data API."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.70",
    "decodo-sdk>=2.4",
    "httpx>=0.27",
    "pydantic>=2.7",
    "selectolax>=1.0",
]

[project.scripts]
price-agent = "price_agent.cli:main"

[project.optional-dependencies]
mcp = [
    "mcp>=2.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/price_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
