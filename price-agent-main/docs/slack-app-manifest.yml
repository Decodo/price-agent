# Slack app for price-agent alerts. Create it at https://api.slack.com/apps?new_app=1 ("From a manifest"),
# install it to a channel, then copy the webhook URL into .env as SLACK_WEBHOOK_URL.
display_information:
  name: price-agent
  description: Alerts and pricing proposals from the price-monitoring agent
  background_color: "#1f2937"
features:
  bot_user:
    display_name: price-agent
    always_online: false
oauth_config:
  scopes:
    bot:
      - incoming-webhook
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
